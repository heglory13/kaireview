services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:3000"
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      HOSTNAME: 0.0.0.0
      SQLITE_PATH: /app/data/iaa.sqlite
      CORS_ORIGIN: ${NEXT_PUBLIC_SITE_URL}
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      ADMIN_NOTIFICATION_EMAIL: ${ADMIN_NOTIFICATION_EMAIL}
      PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      API_PUBLIC_URL: ${NEXT_PUBLIC_API_BASE_URL}
    volumes:
      - backend-data:/app/data
      - backend-uploads:/app/uploads
    ports:
      - "${BACKEND_HOST_PORT:-4000}:4000"

volumes:
  backend-data:
  backend-uploads:
